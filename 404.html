<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Get the correct path from the URL and redirect to it
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;
        // Redirect to the main index.html with the full path
        window.location.href = `/index.html?path=${encodeURIComponent(path + search + hash)}`;
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; URL=/index.html">
    </noscript>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
